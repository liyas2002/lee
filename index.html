<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartBuy India</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}
header{background:#111827;color:white;padding:28px 18px;text-align:center}
header h1{margin:0 0 8px;font-size:30px}
header p{margin:0;color:#d1d5db}
.container{max-width:900px;margin:auto;padding:20px}
.filters{background:white;padding:18px;border-radius:16px;box-shadow:0 4px 18px #00000010;margin-bottom:22px}
label{font-weight:700;display:block;margin:12px 0 7px}
select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #d1d5db;font-size:16px}
button{background:#111827;color:white;border:0;font-weight:700;cursor:pointer;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 18px #00000010}
.badge{display:inline-block;background:#e5e7eb;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:700}
.card h3{margin:12px 0 7px}
.price{font-size:22px;font-weight:800}
.meta{color:#6b7280;font-size:14px;line-height:1.5}
.buy{display:block;text-align:center;text-decoration:none;background:#16a34a;color:white;padding:12px;border-radius:10px;margin-top:14px;font-weight:700}
.note{font-size:12px;color:#6b7280;text-align:center;margin-top:20px}
.empty{text-align:center;padding:35px;background:white;border-radius:16px}
</style>
</head>
<body>

<header>
  <h1>SmartBuy India</h1>
  <p>Find useful gadgets within your budget.</p>
</header>

<main class="container">
  <section class="filters">
    <label for="category">Category</label>
    <select id="category">
      <option value="all">All gadgets</option>
      <option value="earbuds">Earbuds</option>
      <option value="smartwatch">Smartwatch</option>
      <option value="powerbank">Power Bank</option>
      <option value="speaker">Bluetooth Speaker</option>
    </select>

    <label for="budget">Budget</label>
    <select id="budget">
      <option value="2000">Under ₹2,000</option>
      <option value="1000">Under ₹1,000</option>
      <option value="500">Under ₹500</option>
    </select>

    <button onclick="findProducts()">Find Best</button>
  </section>

  <section id="results" class="grid"></section>

  <p class="note">
    Prices and availability are examples in this demo. Verify current details before buying.
  </p>
</main>

<script>
const products = [
  {name:"Demo Earbuds A", category:"earbuds", price:1499, rating:"4.3/5", why:"Good everyday option with balanced features."},
  {name:"Demo Earbuds B", category:"earbuds", price:1899, rating:"4.4/5", why:"Designed for longer battery use."},
  {name:"Demo Smartwatch A", category:"smartwatch", price:1799, rating:"4.2/5", why:"Useful basic smartwatch features."},
  {name:"Demo Power Bank A", category:"powerbank", price:999, rating:"4.3/5", why:"Compact option for daily charging."},
  {name:"Demo Speaker A", category:"speaker", price:1299, rating:"4.1/5", why:"Portable choice for casual listening."}
];

function findProducts(){
  const category = document.getElementById("category").value;
  const budget = Number(document.getElementById("budget").value);

  const matches = products.filter(p =>
    p.price <= budget &&
    (category === "all" || p.category === category)
  );

  const results = document.getElementById("results");

  if(!matches.length){
    results.innerHTML = '<div class="empty">No demo products match this budget yet.</div>';
    return;
  }

  results.innerHTML = matches.map(p => `
    <article class="card">
      <span class="badge">${p.category}</span>
      <h3>${p.name}</h3>
      <div class="price">₹${p.price.toLocaleString("en-IN")}</div>
      <p class="meta">Rating: ${p.rating}<br>${p.why}</p>
      <a class="buy" href="#" onclick="alert('Real affiliate link will be added here later.');return false;">
        Check Price
      </a>
    </article>
  `).join("");
}

findProducts();
</script>

</body>
</html>
